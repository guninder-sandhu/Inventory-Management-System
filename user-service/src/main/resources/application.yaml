server:
  port: 8081

spring:
  datasource:
    #    url: jdbc:mysql://localhost:3306/usermicroservice
    url: jdbc:mysql://mysqldb:3306/usermicroservice
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: USER-SERVICE
  config:
    import: optional:configserver:http://configserver:8084/

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka

