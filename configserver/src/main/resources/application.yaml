spring:
  application:
    name: CONFIG-SERVER

  cloud:
    config:
      server:
        git:
          uri: https://github.com/guninder-sandhu/config-server
          username: guninder-sandhu
          password: ${GITHUB_TOKEN}
          clone-on-start: true

server:
  port: 8084

logging:
  level:
    org.springframework.cloud.config: DEBUG

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://serviceregistry:8761/eureka
